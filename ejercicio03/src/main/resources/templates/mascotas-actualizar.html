<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <title>Mascotas - Actualizar</title>
</head>
<body>

<div class="container">
    <h1>Ejemplo de app Monolitica</h1>
    <h2>Actualizar Mascota</h2>
    <form th:action = "@{/mascotas/actualizar}" th:object ="${mascota}" method = "post">
        <input th:field="*{id}" type = "hidden" />
        <div class ="mb-3" >
            <label for="nombre" class="form-label">Nombre</label>
            <input th:field = "*{nombre}" type="text" class ="form-control" required></div>
        <div class ="mb-3" >
            <label for="edad" class="form-label">Edad</label>
            <input th:field = "*{edad}" type="number" class ="form-control" required></div>
        <div class ="mb-3" >
            <label for="observaciones" class="form-label">Observaciones</label>
            <input th:field = "*{observaciones}" type="text" class ="form-control" ></div>
        <button type="submit" class="btn btn-info">Actualizar</button>
        <a th:href="@{'/'}" class="btn btn-danger">Cancelar</a>

    </form>
</div>

</body>

</html>
